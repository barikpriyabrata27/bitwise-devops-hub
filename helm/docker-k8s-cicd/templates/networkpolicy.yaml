{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docker-k8s-cicd.fullname" . }}
  labels:
    {{- include "docker-k8s-cicd.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "docker-k8s-cicd.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: http
{{- end }}