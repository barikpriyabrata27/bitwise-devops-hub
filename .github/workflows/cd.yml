name: CD - Deploy to Local Kubernetes

# Runs on a self-hosted runner registered on the machine that hosts the
# local kind cluster, since GitHub-hosted runners cannot reach it.
on:
  workflow_run:
    workflows: ["CI - Build and Push Image"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Load image into kind cluster
        run: kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --name docker-k8s-cicd

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl set image deployment/python-app python-app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          kubectl rollout status deployment/python-app

      - name: Verify deployment endpoints
        run: ./scripts/smoke-test.sh
